# Apache مستقل لتطبيق dawak فقط: خدمة Windows باسم ApacheDawak على 127.0.0.1:8081.
# لا يمس خدمة Apache2.4 الحيّة (8080/443) ولا httpd.conf: يستعمل نفس برامج XAMPP بإعداد ومنفذ وسجلات خاصة.
# النسخة الفعلية تُنسخ إلى C:\dawak-apache\conf\httpd-dawak.conf بـ install-apache-dawak.ps1.
# الفحص:   C:\xampp\apache\bin\httpd.exe -t -f C:\dawak-apache\conf\httpd-dawak.conf

Define APPROOT "C:/Users/Administrator/Desktop/dawak-project-develop"
Define DAWAKROOT "C:/dawak-apache"

ServerRoot "C:/xampp/apache"
# محلي فقط: النفق وحده يصل إليه.
Listen 127.0.0.1:8081
ServerName 127.0.0.1:8081
PidFile "${DAWAKROOT}/logs/httpd.pid"
ErrorLog "${DAWAKROOT}/logs/error.log"
LogLevel warn
ServerTokens Prod
ServerSignature Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so

# كما بـhttpd.conf الحيّ (مطلوب على Windows).
AcceptFilter http none
AcceptFilter https none

<IfModule mpm_winnt_module>
    ThreadsPerChild 150
    MaxConnectionsPerChild 0
</IfModule>

Timeout 300
KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 5

# PHP نفسه الذي يستعمله artisan serve، لكن بنسخة php.ini خاصة بهذه الخدمة.
LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "${DAWAKROOT}"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
DirectoryIndex index.php index.html
LogFormat "%h %t \"%r\" %>s %b %Dus" timed
CustomLog "${DAWAKROOT}/logs/access.log" timed

# ضغط النصوص (مهم عبر النفق: صفحات التقارير بالميغابايتات).
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml

# الأصول الثابتة 30 يوماً: كل طلب تحقق (304) يدفع زمن النفق كاملاً.
# table-tools.js يُطلب بـ?v=<filemtime> فيتجدّد فور تعديله.
ExpiresActive On
<FilesMatch "\.(css|js|woff2?|png|jpe?g|svg|ico)$">
    ExpiresDefault "access plus 30 days"
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>

DocumentRoot "${APPROOT}/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${APPROOT}/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# اختبارات محلية مؤقتة فقط (لا يوجد الملف بالتشغيل العادي).
IncludeOptional "${DAWAKROOT}/conf/test-only*.conf"
